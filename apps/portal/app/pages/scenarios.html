<div class="page active scenario-atlas-page" id="scenarios-page">
  <button class="scenario-atlas-back" type="button" onclick="app.loadPage('range-hub')" aria-label="Back to Range Hub" title="Back to Range Hub">←</button>
  <header class="scenario-atlas-header">
    <div>
      <span class="scenario-atlas-kicker">OXBLOOD // PLAYBOOK ATLAS</span>
      <h1 class="page-title">Scenarios</h1>
      <p>Choose a playbook node to inspect its mission design and launch readiness.</p>
    </div>
    <div class="scenario-atlas-actions">
      <label class="scenario-atlas-search"><span aria-hidden="true">⌕</span><input type="search" id="scenario-atlas-search" placeholder="Find a scenario" oninput="app.filterScenarioGraph(this.value)" aria-label="Find a scenario"></label>
      <button class="btn btn-secondary" type="button" onclick="app.loadScenariosPage()" title="Refresh catalog">Refresh</button>
    </div>
  </header>

  <div class="scenario-atlas-toolbar">
    <span id="scenario-atlas-count">Loading catalog...</span>
    <div class="scenario-atlas-zoom" role="group" aria-label="Atlas controls">
      <button type="button" onclick="app.zoomScenarioGraph(1.18)" aria-label="Zoom in" title="Zoom in">+</button>
      <button type="button" onclick="app.zoomScenarioGraph(0.84)" aria-label="Zoom out" title="Zoom out">−</button>
      <button type="button" onclick="app.fitScenarioGraph()" title="Fit atlas">Fit</button>
    </div>
  </div>

  <section class="scenario-atlas-viewport" id="scenario-atlas-viewport" aria-label="Interactive scenario atlas">
    <svg class="scenario-atlas-symbols" aria-hidden="true" focusable="false">
      <symbol id="scenario-atlas-icon-playbook" viewBox="0 0 32 32"><path d="M7 4h13l6 6v18H7z"/><path d="M20 4v7h6M11 16h11m-11 5h11m-11 5h7"/></symbol>
    </svg>
    <div class="scenario-atlas-world" id="scenario-atlas-world">
      <svg class="scenario-atlas-links" id="scenario-atlas-links" aria-hidden="true"></svg>
      <div class="scenario-atlas-nodes" id="scenario-atlas-nodes" aria-live="polite">
        <div class="scenario-atlas-loading"><span></span>Synchronizing catalog signals</div>
      </div>
    </div>
    <aside class="scenario-atlas-inspector" id="scenario-atlas-inspector" hidden aria-live="polite"></aside>
    <div class="scenario-atlas-hint">DRAG TO EXPLORE <i></i> SCROLL TO ZOOM</div>
  </section>
  <footer class="scenario-atlas-footer"><span><i></i>PLAYBOOK CATALOG</span><span id="scenario-atlas-footer-status">Environment status checking</span><span>ONE SHARED RANGE</span></footer>
</div>
