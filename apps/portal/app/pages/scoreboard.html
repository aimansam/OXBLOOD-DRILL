<main class="workspace-scoreboard" aria-labelledby="scoreboard-title">
  <header class="workspace-scoreboard-head">
    <div>
      <h1 id="scoreboard-title">Scoreboard</h1>
      <p>Exercise results and participant progress.</p>
    </div>
    <label class="workspace-scoreboard-picker">Exercise
      <select id="scoreboard-exercise" onchange="app.showScoreboardRun(this.value)" aria-label="Choose exercise"><option>Loading exercises...</option></select>
    </label>
  </header>
  <div class="workspace-scoreboard-section"><div class="workspace-scoreboard-section-head"><h2>Standings</h2><span id="scoreboard-count"></span></div><div id="scoreboard-body" aria-live="polite"><p class="workspace-empty">Loading scores...</p></div></div>
</main>
