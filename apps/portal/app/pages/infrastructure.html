<div class="page active infrastructure-atlas-page" id="infrastructure-page">
  <button class="infrastructure-atlas-back" type="button" onclick="app.loadPage('range-hub')" aria-label="Back to Range Hub" title="Back to Range Hub">←</button>
  <header class="infrastructure-atlas-header">
    <div><span class="infrastructure-atlas-kicker">OxBlood / Range</span><h1 class="page-title">Infrastructure</h1><p>Hosts, guests, storage, and network readiness.</p></div>
    <div class="infrastructure-atlas-actions">
      <label class="infrastructure-atlas-search"><span aria-hidden="true">⌕</span><input type="search" id="infrastructure-atlas-search" placeholder="Find infrastructure" oninput="app.filterInfrastructureGraph(this.value)" aria-label="Find infrastructure"></label>
      <button class="btn btn-secondary" type="button" onclick="app.loadInfrastructurePage()" title="Refresh infrastructure">Refresh</button>
    </div>
  </header>
  <div class="infrastructure-atlas-toolbar"><span id="infrastructure-atlas-count">Reading range inventory...</span><div class="infrastructure-atlas-zoom" role="group" aria-label="Infrastructure map controls"><button type="button" onclick="app.zoomInfrastructureGraph(1.18)" aria-label="Zoom in" title="Zoom in">+</button><button type="button" onclick="app.zoomInfrastructureGraph(0.84)" aria-label="Zoom out" title="Zoom out">−</button><button type="button" onclick="app.fitInfrastructureGraph()" title="Fit inventory">Fit</button></div></div>
  <section class="infrastructure-atlas-viewport" id="infrastructure-atlas-viewport" aria-label="Interactive infrastructure atlas">
    <svg class="infrastructure-atlas-symbols" aria-hidden="true" focusable="false">
      <symbol id="infrastructure-atlas-icon-host" viewBox="0 0 32 32"><rect x="5" y="4" width="22" height="8" rx="1"/><rect x="5" y="16" width="22" height="8" rx="1"/><path d="M9 8h1m-1 12h1M11 28h10"/></symbol>
      <symbol id="infrastructure-atlas-icon-guests" viewBox="0 0 32 32"><rect x="4" y="5" width="17" height="14" rx="2"/><rect x="11" y="13" width="17" height="14" rx="2"/><path d="M16 22h7m-7 4h5"/></symbol>
      <symbol id="infrastructure-atlas-icon-templates" viewBox="0 0 32 32"><path d="M7 4h13l6 6v18H7z"/><path d="M20 4v7h6M11 17h11m-11 5h8"/></symbol>
      <symbol id="infrastructure-atlas-icon-storage" viewBox="0 0 32 32"><ellipse cx="16" cy="7" rx="11" ry="4"/><path d="M5 7v18c0 2.2 4.9 4 11 4s11-1.8 11-4V7M5 16c0 2.2 4.9 4 11 4s11-1.8 11-4"/></symbol>
      <symbol id="infrastructure-atlas-icon-networks" viewBox="0 0 32 32"><circle cx="7" cy="16" r="3"/><circle cx="25" cy="7" r="3"/><circle cx="25" cy="25" r="3"/><path d="m10 15 12-7M10 17l12 7"/></symbol>
      <symbol id="infrastructure-atlas-icon-cleanup" viewBox="0 0 32 32"><path d="M5 8h22M12 8V4h8v4m4 0-1 20H9L8 8m4 5v10m8-10v10"/></symbol>
      <symbol id="infrastructure-atlas-icon-health" viewBox="0 0 32 32"><path d="M3 17h7l4-9 6 16 4-8h5"/></symbol>
    </svg>
    <div class="infrastructure-atlas-world" id="infrastructure-atlas-world">
      <svg class="infrastructure-atlas-links" id="infrastructure-atlas-links" aria-hidden="true"></svg>
      <div class="infrastructure-atlas-nodes" id="infrastructure-atlas-nodes" aria-live="polite"><div class="infrastructure-atlas-loading"><span></span>Connecting to infrastructure sources</div></div>
    </div>
    <aside class="infrastructure-atlas-inspector" id="infrastructure-atlas-inspector" hidden aria-live="polite"></aside>
    <div class="infrastructure-atlas-hint">DRAG TO MOVE <i></i> SCROLL TO ZOOM</div>
  </section>
  <footer class="infrastructure-atlas-footer"><span><i></i>INFRASTRUCTURE MAP</span><span id="infrastructure-atlas-status">Proxmox inventory synchronizing</span><span>ADMIN VIEW</span></footer>
</div>
