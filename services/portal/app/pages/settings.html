
          <div class="page-header">
            <h1 class="page-title">Settings</h1>
          </div>

          <div class="grid grid-2">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Profile</h3>
              </div>
              <div style="display: flex; flex-direction: column; gap: var(--space-md);">
                <div>
                  <label style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;">Username</label>
                  <input type="text" value="john_doe" style="width: 100%;">
                </div>
                <div>
                  <label style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;">Email</label>
                  <input type="text" value="john@example.com" style="width: 100%;">
                </div>
                <button class="btn btn-primary" style="align-self: flex-start;">Save Changes</button>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Security</h3>
              </div>
              <div style="display: flex; flex-direction: column; gap: var(--space-md);">
                <button class="btn btn-secondary">Change Password</button>
                <button class="btn btn-secondary">Enable Two-Factor Authentication</button>
                <button class="btn btn-secondary">View Active Sessions</button>
              </div>
            </div>

            <!-- Drill Record Card (live-ops; XP/badges live in Learn) -->
            <div class="card" style="grid-column: 1/-1;">
              <div class="card-header">
                <h3 class="card-title">Drill Record</h3>
              </div>
              <div id="user-stats" style="padding: var(--space-md);">
                <div style="text-align: center; color: var(--text-secondary);">Loading drill record...</div>
              </div>
            </div>

            <!-- Activity Card -->
            <div class="card" style="grid-column: 1/-1;">
              <div class="card-header">
                <h3 class="card-title">Recent Activity</h3>
              </div>
              <div id="user-activity" style="padding: var(--space-md);">
                <div style="text-align: center; color: var(--text-secondary);">Loading activity...</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
