
          <div class="page-header">
            <h1 class="page-title">Settings</h1>
          </div>

          <div class="grid grid-2">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Profile</h3>
              </div>
              <div id="settings-profile" style="display: flex; flex-direction: column; gap: var(--space-md);">
                <div style="text-align: center; color: var(--text-secondary);">Loading profile...</div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Security</h3>
              </div>
              <div style="display: flex; flex-direction: column; gap: var(--space-md);">
                <div style="font-size: 12px; color: var(--text-secondary);">Token expires in <span id="token-ttl" style="font-family: var(--font-mono);">—</span></div>
                <button class="btn btn-secondary" onclick="Auth.logout()">Sign Out All Sessions</button>
              </div>
            </div>

            <!-- Drill Record Card (live-ops; XP/badges live in Learn) -->
            <div class="card" style="grid-column: 1/-1;">
              <div class="card-header">
                <h3 class="card-title">Drill Record</h3>
              </div>
              <div id="user-stats" style="padding: var(--space-md);">
                <div style="text-align: center; color: var(--text-secondary);">Loading drill record...</div>
              </div>
            </div>

            <!-- Activity Card -->
            <div class="card" style="grid-column: 1/-1;">
              <div class="card-header">
                <h3 class="card-title">Recent Activity</h3>
              </div>
              <div id="user-activity" style="padding: var(--space-md);">
                <div style="text-align: center; color: var(--text-secondary);">Loading activity...</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

  <script src="/auth.js"></script>
  <script src="/api.js"></script>
  <script src="/app.js"></script>
  <script src="/ui-utils.js"></script>
  <script src="/ui-drills.js"></script>
  <script src="/ui-advanced.js"></script>
</body>
</html>
