          <div class="page-header">
            <h1 class="page-title">Setup</h1>
            <div class="small muted">Admin-only platform configuration. Secrets are never displayed.</div>
          </div>

          <div class="grid grid-2">
            <div class="card">
              <div class="card-header"><h3 class="card-title">Users &amp; Access</h3><button class="btn btn-secondary btn-sm" onclick="app.loadSetupUsers()">Refresh</button></div>
              <div id="setup-users"><div class="empty-state"><div class="empty-hint">Loading users…</div></div></div>
              <div style="border-top: 1px solid var(--border); margin-top: var(--space-md); padding-top: var(--space-md);">
                <div class="label" style="margin-bottom: var(--space-sm);">Create user</div>
                <div style="display: flex; gap: var(--space-sm); flex-wrap: wrap;">
                  <input id="setup-new-sub" class="input" placeholder="username" style="flex: 2; min-width: 140px;" autocomplete="off">
                  <input id="setup-new-pass" class="input" type="password" placeholder="password" style="flex: 2; min-width: 140px;" autocomplete="new-password">
                  <select id="setup-new-role" class="input" style="flex: 1; min-width: 110px;">
                    <option value="red">red</option>
                    <option value="blue">blue</option>
                    <option value="lead">lead</option>
                    <option value="observer">observer</option>
                    <option value="admin">admin</option>
                  </select>
                  <button class="btn btn-primary btn-sm" onclick="app.setupCreateUser()">Create</button>
                </div>
                <div id="setup-user-msg" class="small" style="margin-top: var(--space-sm);"></div>
              </div>
            </div>

            <div class="card">
              <div class="card-header"><h3 class="card-title">Infrastructure (PVE)</h3><button class="btn btn-secondary btn-sm" onclick="app.loadSetupPve()">Refresh</button></div>
              <div id="setup-pve"><div class="empty-state"><div class="empty-hint">Loading PVE config…</div></div></div>
              <div style="border-top: 1px solid var(--border); margin-top: var(--space-md); padding-top: var(--space-md);">
                <div class="label" style="margin-bottom: var(--space-sm);">Update credentials (probed before save)</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm);">
                  <input id="setup-pve-host" class="input" placeholder="host (e.g. 192.168.1.10)">
                  <input id="setup-pve-node" class="input" placeholder="node (e.g. pve)">
                  <input id="setup-pve-user" class="input" placeholder="user (e.g. divide@pve)">
                  <input id="setup-pve-port" class="input" placeholder="port (8006)" inputmode="numeric">
                  <input id="setup-pve-token-id" class="input" placeholder="token id" autocomplete="off">
                  <input id="setup-pve-token-secret" class="input" type="password" placeholder="token secret" autocomplete="new-password">
                </div>
                <div style="display: flex; gap: var(--space-sm); margin-top: var(--space-sm); align-items: center;">
                  <button class="btn btn-primary btn-sm" onclick="app.setupSavePve()">Save &amp; probe</button>
                  <button class="btn btn-secondary btn-sm" onclick="app.setupRevertPve()">Revert to env</button>
                </div>
                <div id="setup-pve-msg" class="small" style="margin-top: var(--space-sm);"></div>
              </div>
            </div>

            <div class="card">
              <div class="card-header"><h3 class="card-title">Exercise Defaults</h3><span class="small muted">env-managed · restart required</span></div>
              <div id="setup-defaults"><div class="empty-state"><div class="empty-hint">Loading defaults…</div></div></div>
            </div>

            <div class="card">
              <div class="card-header"><h3 class="card-title">System Health</h3><button class="btn btn-secondary btn-sm" onclick="app.loadSetupHealth()">Refresh</button></div>
              <div id="setup-health"><div class="empty-state"><div class="empty-hint">Loading health…</div></div></div>
            </div>
          </div>
