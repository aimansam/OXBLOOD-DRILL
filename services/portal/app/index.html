<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OxBlood Drill - Cyber Adversary Drill Platform</title>
  <link rel="stylesheet" href="/drill/styles.css?v=polish1">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo"><span class="logo-mark">●</span> OxBlood Drill</div>
      <div class="search">
        <input type="search" placeholder="Search drills..." oninput="app.filterDrills(this.value)">
      </div>
      <div class="header-right">
        <div class="rank-badge">OPERATOR</div>
        <div class="user-avatar" title="User menu">JD</div>
      </div>
    </header>

    <div class="main-container">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="nav-item active" data-page="dashboard">
          <svg class="nav-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 13V7M6 13V3M10 13v-6M14 13V5" stroke-linecap="round"/></svg>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-page="drills">
          <svg class="nav-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.5"/><circle cx="8" cy="8" r="0.5" fill="currentColor"/></svg>
          <span>Cyber Drills</span>
        </div>
        <div class="nav-item" data-page="reports">
          <svg class="nav-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.5h5.5L13 5v9.5H4z" stroke-linejoin="round"/><path d="M9.5 1.5V5H13" stroke-linejoin="round"/></svg>
          <span>Reports</span>
        </div>
        <div class="nav-item" data-page="settings">
          <svg class="nav-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4" stroke-linecap="round"/></svg>
          <span>Settings</span>
        </div>
        <div class="nav-item" data-page="setup" id="nav-setup" style="display: none;">
          <svg class="nav-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5.5h4l1 2h4l1-2h2M2 10.5h2l1-2h4l1 2h2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Setup</span>
        </div>
        <div class="nav-item" onclick="logout()" style="margin-top: auto; border-top: 1px solid var(--border);">
          <svg class="nav-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2.5H3.5v11H6M10 5l3.5 3L10 11M13 8H6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Logout</span>
        </div>
      </nav>

      <!-- Content Area - Pages loaded dynamically -->
      <main class="content" id="content">
        <!-- Pages will be loaded here by JavaScript -->
      </main>
    </div>
  </div>

  <script src="/drill/auth.js?v=polish1"></script>
  <script src="/drill/api.js?v=polish1"></script>
  <script src="/drill/app.js?v=polish1"></script>
  <script src="/drill/ui-utils.js?v=polish1"></script>
  <script src="/drill/ui-drills.js?v=polish1"></script>
  <script src="/drill/ui-advanced.js?v=polish1"></script>
</body>
</html>
