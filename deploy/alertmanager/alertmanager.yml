# Alertmanager routes Prometheus alerts (deploy/prometheus/alerts.yml) to you.
#
# This ships with a receiver that does nothing, so alerts are only visible at
# http://127.0.0.1:9093. To get notified, replace the "default" receiver below
# with ONE of the examples (keep secrets out of git: put the real values in a
# local copy and mount that instead, or use *_file options).
route:
  receiver: default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default

