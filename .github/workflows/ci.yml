name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: MyPy
        run: mypy apps/api/app
      - name: Install scenario validation deps
        run: pip install jsonschema pyyaml
      - name: Validate scenario YAML
        run: python tools/validate_scenario.py examples/scenarios/
      - name: OpenAPI snapshot is current
        run: python tools/export_openapi.py --check
      - name: Install portal deps
        run: pip install -r apps/portal/requirements.txt
      - name: Pytest (API)
        run: pytest apps/api/tests tests
        env:
          DIVIDE_DB_URL: sqlite+aiosqlite:///./test.sqlite
          DIVIDE_REDIS_URL: redis://localhost:6379/0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types are current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Real browser tests: the production web build, the Flask portal and the API (SQLite + mock Proxmox).
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DIVIDE_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "apps/api[dev]" -r apps/portal/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies and the browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matplotlib
        run: pip install matplotlib
      - name: Regenerate architecture diagrams
        run: python tools/gen_diagrams.py
      - name: Verify diagrams committed
        run: |
          # PNG bytes differ between matplotlib versions, so compare the set of files, not pixels:
          # a diagram the generator now produces (or no longer produces) means the commit is stale.
          if git status --porcelain assets/diagrams/ | grep -E '^(\?\?| D|D )'; then
            echo "::error::Architecture diagrams are out of date. Run 'python tools/gen_diagrams.py' locally and commit the new files."
            exit 1
          fi

  live-pg-tests:
    # Opt-in job: runs only when the `run-live-pg` label is applied to the
    # PR, or when triggered manually. Spins up a Postgres 16 service
    # container, applies alembic migrations, then runs `-m live_pg` tests.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-live-pg')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: divide
          POSTGRES_PASSWORD: divide
          POSTGRES_DB: divide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
      - name: Apply alembic migrations
        env:
          DIVIDE_DB_URL: postgresql+asyncpg://divide:divide@localhost:5432/divide_test
        run: |
          cd apps/api
          PYTHONPATH=. alembic upgrade head
      - name: Pytest (live_pg)
        env:
          DIVIDE_TEST_LIVE_PG: "1"
          DIVIDE_TEST_LIVE_PG_URL: postgresql+asyncpg://divide:divide@localhost:5432/divide_test
        run: pytest -m live_pg apps/api/tests
